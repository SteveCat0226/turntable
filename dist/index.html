<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101312"><meta name="description" content="命運轉盤：放入你的選項，轉動一點未知，讓每次選擇都有驚喜。"><title>命運轉盤 · 讓宇宙幫你決定</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./"><span class="brand-icon">✳</span> 命運轉盤 <small>FATE WHEEL</small></a><button id="sound" class="quiet" aria-pressed="false">♫ <span>音效關閉</span></button></header>
<main><section class="intro"><div class="eyebrow"><span></span> A LITTLE CHANCE, A NEW POSSIBILITY</div><h1>選擇困難？<br>把答案交給<span>命運。</span><i>✧</i></h1><p>放入你的選項，轉動一點未知。<br class="mobile">下一個驚喜，就在指針停下的地方。</p></section>
<section class="workspace" aria-label="命運轉盤工具"><div class="wheel-panel"><div class="wheel-top"><span class="tiny">THE WHEEL OF POSSIBILITIES</span><span class="live"><b></b> <span id="wheel-count">6 個可能</span></span></div><div class="wheel-stage"><div class="orbit"></div><span class="star star-one">✧</span><span class="star star-two">✦</span><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="1000" height="1000" role="img" aria-label="顯示所有選項的命運轉盤"></canvas><button id="hub" aria-label="轉動命運轉盤">轉動<span>SPIN</span></button></div></div><button class="spin" id="spin">轉動命運 <span>↗</span></button><p class="hint" id="hint">每個選項，都有一樣的機會。</p></div>
<aside><div class="card options-card"><div class="card-title"><h2>你的選項 <span id="count">06</span></h2><button id="clear" class="text-button">清空</button></div><p class="sub">任何猶豫不決，都可以放進來。</p><form id="add-form"><input id="new-option" aria-label="新增選項" placeholder="輸入一個可能…" maxlength="32" autocomplete="off"><button type="submit" aria-label="新增選項">＋</button></form><p id="form-message" class="form-message" aria-live="polite"></p><div id="options" class="options"></div><div class="presets"><span>靈感捷徑</span><div><button data-preset="food">🍜 今天吃什麼</button><button data-preset="weekend">☀ 週末做什麼</button><button data-preset="yesno">✧ 幫我決定</button></div></div><label class="toggle-line"><span>抽中後移除<small>讓下一次，有新的可能</small></span><input id="remove-winner" type="checkbox" role="switch"><span class="switch"></span></label></div><div class="card history-card"><div class="card-title"><h2>命運的足跡 <span id="history-count">0</span></h2><button id="clear-history" class="text-button">清除紀錄</button></div><div id="history" aria-live="polite"></div></div></aside></section>
<footer><span>✳ 每個選擇，都是新的開始。</span><span>MADE FOR YOUR LITTLE DILEMMAS</span></footer></main>
<dialog id="result"><button class="close" id="close-result" aria-label="關閉結果">×</button><div class="result-star">✧</div><div class="eyebrow">THE UNIVERSE HAS SPOKEN</div><p>命運為你選中了</p><h2 id="winner"></h2><p class="result-note">相信這一刻的巧合，出發吧。</p><button id="again" class="spin">再轉一次 <span>↗</span></button></dialog><script src="app.js"></script></body></html>
